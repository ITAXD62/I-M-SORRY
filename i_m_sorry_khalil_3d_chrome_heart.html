    /**

     */

    // =========================================================================

      ["Basque", "Barkatu"],

      ["Maori", "Aroha mai"]
    ];

    const RTL = new Set(["Arabic", "Hebrew", "Persian", "Pashto", "Urdu", "Yiddish", "Uyghur"]);
    const N = PHRASES.length;

    // =========================================================================
    // 2. SIMULATION CONSTANTS & CHROME PALETTE
    // =========================================================================
    const GATHER_DURATION = 3.2; // Word gathering entrance duration (seconds)
    const TRAIL = 0.34;
    const TURN = 10.5;

    const W = 720;
    const H = 640;
    const CX = W / 2;
    const CY = H / 2;
    const HEART_WIDTH = 560;
    const TEXT_PX = 13;
    const PITCH = 14.5;
    const GAP = 9;
    const WALL = 15;
    const DOME = 46;
    const WD = 2 * WALL + 6;

    const HALF = [
      [0.0, -0.3575], [0.0301, -0.3662], [0.0563, -0.3844], [0.0825, -0.4024], [0.109, -0.4199],
      [0.1373, -0.4328], [0.1671, -0.4422], [0.1981, -0.4489], [0.231, -0.4507], [0.264, -0.4489],
      [0.2947, -0.4418], [0.3236, -0.43], [0.349, -0.41], [0.3738, -0.3887], [0.3993, -0.3687],
      [0.4241, -0.3474], [0.4442, -0.322], [0.4604, -0.295], [0.4741, -0.267], [0.4852, -0.2379],
      [0.4928, -0.2073], [0.4964, -0.1751], [0.4982, -0.1421], [0.4969, -0.109], [0.4928, -0.077],
      [0.4857, -0.0462], [0.4767, -0.0162], [0.465, 0.0126], [0.4513, 0.0406], [0.4351, 0.0676],
      [0.4176, 0.0941], [0.3988, 0.12], [0.3788, 0.1454], [0.3562, 0.1698], [0.3319, 0.1923],
      [0.3075, 0.2149], [0.2826, 0.2362], [0.2577, 0.2575], [0.2329, 0.2788], [0.208, 0.3001],
      [0.1831, 0.3214], [0.1577, 0.3414], [0.1323, 0.3614], [0.1069, 0.3815], [0.0809, 0.4002],
      [0.0548, 0.4185], [0.028, 0.4352], [0.0, 0.4489]
    ];

    // Ice-Blue / Silver / Deep Indigo Chrome Reflection Environment
    const SKY = [235 / 255, 245 / 255, 255 / 255];
    const BAND = [45 / 255, 55 / 255, 85 / 255];
    const FLOOR = [170 / 255, 205 / 255, 245 / 255];

    // =========================================================================
    // 3. SPRITE RASTERIZER (Crisp Alpha Masks + Canvas Sprites for 3D Swarm)
    // =========================================================================
    const SPRITES = [];

    function generateSprites() {
      const off = document.createElement("canvas");
      off.width = 512;
      off.height = 96;
      const octx = off.getContext("2d", { willReadFrequently: true });

      for (let i = 0; i < N; i++) {
        const [lang, text] = PHRASES[i];
        octx.clearRect(0, 0, off.width, off.height);
        octx.fillStyle = "#ffffff";
        octx.textBaseline = "middle";
        octx.textAlign = "left";
        octx.direction = RTL.has(lang) ? "rtl" : "ltr";
        octx.font = `600 34px "Inter", "Noto Sans Arabic", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Microsoft YaHei", "Hiragino Sans", sans-serif`;

        const drawX = RTL.has(lang) ? 480 : 20;
        octx.fillText(text, drawX, 48);

        const imgData = octx.getImageData(0, 0, off.width, off.height).data;
        let minX = off.width, minY = off.height, maxX = -1, maxY = -1;

        for (let y = 0; y < off.height; y++) {
          for (let x = 0; x < off.width; x++) {
            const alpha = imgData[(y * off.width + x) * 4 + 3];
            if (alpha > 12) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }

        if (maxX < minX || maxY < minY) {
          const fallback = document.createElement("canvas");
          fallback.width = 10;
          fallback.height = 10;
          SPRITES.push({ w: 10, h: 10, data: new Float32Array(100), canvas: fallback });
          continue;
        }

        const sw = maxX - minX + 1;
        const sh = maxY - minY + 1;
        const alphaArr = new Float32Array(sw * sh);

        // Pre-tinted chrome-ice sprite canvas for ultra-fast 3D swarm rendering
        const spCanvas = document.createElement("canvas");
        spCanvas.width = sw;
        spCanvas.height = sh;
        const spCtx = spCanvas.getContext("2d");
        const spImg = spCtx.createImageData(sw, sh);

        for (let y = 0; y < sh; y++) {
          const vNorm = y / Math.max(1, sh - 1);
          // Subtle vertical metallic gradient for flying sprites
          const rCol = Math.round(185 + 70 * (1 - vNorm));
          const gCol = Math.round(212 + 43 * (1 - vNorm));
          const bCol = 255;

          for (let x = 0; x < sw; x++) {
            const srcIdx = ((minY + y) * off.width + (minX + x)) * 4 + 3;
            const a = imgData[srcIdx];
            alphaArr[y * sw + x] = a / 255.0;

            const dstIdx = (y * sw + x) * 4;
            spImg.data[dstIdx] = rCol;
            spImg.data[dstIdx + 1] = gCol;
            spImg.data[dstIdx + 2] = bCol;
            spImg.data[dstIdx + 3] = a;
          }
        }
        spCtx.putImageData(spImg, 0, 0);

        SPRITES.push({ w: sw, h: sh, data: alphaArr, canvas: spCanvas });
      }
    }

    const SPRITE_CACHE = new Map();

    function getScaledSprite(idx, k) {
      const key = `${idx}_${Math.round(k * 200)}`;
      if (SPRITE_CACHE.has(key)) return SPRITE_CACHE.get(key);

      const src = SPRITES[idx];
      const dw = Math.max(1, Math.round(src.w * k));
      const dh = Math.max(1, Math.round(src.h * k));
      const dst = new Float32Array(dw * dh);

      for (let y = 0; y < dh; y++) {
        const sy = Math.min(src.h - 1, (y + 0.5) / k - 0.5);
        const y0 = Math.max(0, Math.floor(sy));
        const y1 = Math.min(src.h - 1, y0 + 1);
        const fy = sy - y0;

        for (let x = 0; x < dw; x++) {
          const sx = Math.min(src.w - 1, (x + 0.5) / k - 0.5);
          const x0 = Math.max(0, Math.floor(sx));
          const x1 = Math.min(src.w - 1, x0 + 1);
          const fx = sx - x0;

          const v00 = src.data[y0 * src.w + x0];
          const v10 = src.data[y0 * src.w + x1];
          const v01 = src.data[y1 * src.w + x0];
          const v11 = src.data[y1 * src.w + x1];

          const top = v00 * (1 - fx) + v10 * fx;
          const bot = v01 * (1 - fx) + v11 * fx;
          dst[y * dw + x] = top * (1 - fy) + bot * fy;
        }
      }

      const res = { w: dw, h: dh, data: dst };
      SPRITE_CACHE.set(key, res);
      return res;
    }

    // =========================================================================
    // 4. 3D RELIEF FIELD (INSIDE, DISTANCE TRANSFORM, DOME, RAISED LIP, NORMALS)
    // =========================================================================
    const INSIDE = new Uint8Array(W * H);
    const DIST = new Float32Array(W * H);
    const RAD = new Float32Array(W * H);
    const Z_FIELD = new Float32Array(W * H);
    const ZX = new Float32Array(W * H);
    const ZY = new Float32Array(W * H);
    const RUNS = [];

    function buildHeartGeometry() {
      const maskCanvas = document.createElement("canvas");
      maskCanvas.width = W;
      maskCanvas.height = H;
      const mctx = maskCanvas.getContext("2d");
      mctx.fillStyle = "#000";
      mctx.fillRect(0, 0, W, H);

      mctx.beginPath();
      for (let i = 0; i < HALF.length; i++) {
        const px = CX + HALF[i][0] * HEART_WIDTH;
        const py = CY + HALF[i][1] * HEART_WIDTH;
        if (i === 0) mctx.moveTo(px, py);
        else mctx.lineTo(px, py);
      }
      for (let i = HALF.length - 1; i >= 0; i--) {
        const px = CX - HALF[i][0] * HEART_WIDTH;
        const py = CY + HALF[i][1] * HEART_WIDTH;
        mctx.lineTo(px, py);
      }
      mctx.closePath();
      mctx.fillStyle = "#fff";
      mctx.fill();

      const img = mctx.getImageData(0, 0, W, H).data;
      for (let i = 0; i < W * H; i++) {
        INSIDE[i] = img[i * 4] > 127 ? 1 : 0;
      }

      const INF = 1e6;
      const d = new Float32Array(W * H);
      for (let i = 0; i < W * H; i++) {
        d[i] = INSIDE[i] ? INF : 0;
      }
      for (let y = 1; y < H - 1; y++) {
        for (let x = 1; x < W - 1; x++) {
          const i = y * W + x;
          if (d[i] === 0) continue;
          let m = d[i];
          if (d[i - 1] + 1 < m) m = d[i - 1] + 1;
          if (d[i - W] + 1 < m) m = d[i - W] + 1;
          if (d[i - W - 1] + 1.4142 < m) m = d[i - W - 1] + 1.4142;
          if (d[i - W + 1] + 1.4142 < m) m = d[i - W + 1] + 1.4142;
          d[i] = m;
        }
      }
      let maxDist = 1e-5;
      for (let y = H - 2; y >= 1; y--) {
        for (let x = W - 2; x >= 1; x--) {
          const i = y * W + x;
          if (d[i] === 0) continue;
          let m = d[i];
          if (d[i + 1] + 1 < m) m = d[i + 1] + 1;
          if (d[i + W] + 1 < m) m = d[i + W] + 1;
          if (d[i + W + 1] + 1.4142 < m) m = d[i + W + 1] + 1.4142;
          if (d[i + W - 1] + 1.4142 < m) m = d[i + W - 1] + 1.4142;
          d[i] = m;
          if (m > maxDist) maxDist = m;
        }
      }

      for (let i = 0; i < W * H; i++) {
        DIST[i] = d[i];
        RAD[i] = INSIDE[i] ? Math.max(0, 1 - d[i] / maxDist) : 1.0;
      }

      const rawZ = new Float32Array(W * H);
      for (let i = 0; i < W * H; i++) {
        if (!INSIDE[i]) continue;
        const distVal = DIST[i];
        const radVal = RAD[i];
        const lip =
          Math.exp(-Math.pow((distVal - 9.5) / 3.5, 2)) * 6.8 -
          Math.exp(-Math.pow((distVal - 22.5) / 4.8, 2)) * 4.8;
        const dome = DOME * Math.sqrt(Math.max(0, 1 - radVal * radVal));
        rawZ[i] = WALL + dome + lip;
      }

      const tempZ = new Float32Array(W * H);
      const kernel = [0.06, 0.24, 0.4, 0.24, 0.06];
      for (let y = 0; y < H; y++) {
        for (let x = 2; x < W - 2; x++) {
          const i = y * W + x;
          if (!INSIDE[i]) continue;
          let sum = 0;
          for (let k = -2; k <= 2; k++) {
            sum += rawZ[i + k] * kernel[k + 2];
          }
          tempZ[i] = sum;
        }
      }
      for (let y = 2; y < H - 2; y++) {
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          if (!INSIDE[i]) continue;
          let sum = 0;
          for (let k = -2; k <= 2; k++) {
            sum += tempZ[(y + k) * W + x] * kernel[k + 2];
          }
          Z_FIELD[i] = sum;
        }
      }

      for (let y = 1; y < H - 1; y++) {
        for (let x = 1; x < W - 1; x++) {
          const i = y * W + x;
          if (!INSIDE[i]) continue;
          ZX[i] = (Z_FIELD[i + 1] - Z_FIELD[i - 1]) * 0.5;
          ZY[i] = (Z_FIELD[i + W] - Z_FIELD[i - W]) * 0.5;
        }
      }

      for (let y = 0; y < H; y++) {
        let start = -1;
        for (let x = 0; x < W; x++) {
          const inside = INSIDE[y * W + x] === 1;
          if (inside && start === -1) {
            start = x;
          } else if (!inside && start !== -1) {
            RUNS.push({ y, x0: start, x1: x - 1 });
            start = -1;
          }
        }
        if (start !== -1) {
          RUNS.push({ y, x0: start, x1: W - 1 });
        }
      }
    }

    // =========================================================================
    // 5. JUSTIFIED TYPOGRAPHY LAYOUT & 3D SWARM PARTICLE INITIALIZATION
    // =========================================================================
    const LAYOUT = { 0: [], 1: [] };
    let SIDE_ROWS = [];
    let BASE_SCALE = 1.0;

    // Every individual phrase gets a 3D scatter trajectory that converges into its exact heart slot
    const SWARM_WORDS = [];

    function seededRandom(seed) {
      const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
      return x - Math.floor(x);
    }

    function fitRow(xl, xr, first, k) {
      const span = xr - xl;
      const picks = [];
      let used = 0.0;
      let j = first;

      for (let step = 0; step < 40; step++) {
        let found = false;
        let chosenIdx = 0;
        let chosenW = 0;
        for (let tries = 0; tries < 14; tries++) {
          const idx = (j + tries * 5) % N;
          const w = SPRITES[idx].w * k;
          if (used + w + (picks.length > 0 ? GAP : 0) <= span) {
            chosenIdx = idx;
            chosenW = w;
            found = true;
            break;
          }
        }
        if (!found) break;
        used += chosenW + (picks.length > 0 ? GAP : 0);
        picks.push({ idx: chosenIdx, w: chosenW });
        j = chosenIdx + 7;
      }

      if (picks.length === 0) return [];
      const totalW = picks.reduce((acc, p) => acc + p.w, 0);
      const gap = (span - totalW) / Math.max(picks.length - 1, 1);
      const out = [];
      let x = picks.length > 1 ? xl : xl + (span - picks[0].w) / 2;

      for (const p of picks) {
        out.push({ idx: p.idx, x, w: p.w });
        x += p.w + gap;
      }
      return out;
    }

    function createSwarmParticle(idx, targetX, targetY, targetZ, scale, side, seedBase) {
      const r1 = seededRandom(seedBase + 1);
      const r2 = seededRandom(seedBase + 2);
      const r3 = seededRandom(seedBase + 3);
      const r4 = seededRandom(seedBase + 4);
      const r5 = seededRandom(seedBase + 5);

      // Wide spherical / vortex 3D scatter cloud around the heart center
      const theta = r1 * Math.PI * 2;
      const phi = Math.acos(2 * r2 - 1);
      const radius = 290 + r3 * 360;

      const startX = Math.sin(phi) * Math.cos(theta) * radius * 1.25;
      const startY = Math.cos(phi) * radius * 1.05;
      const startZ = Math.sin(phi) * Math.sin(theta) * radius;

      // Subtle staggered arrival so words stream in organically and lock into place
      const delay = r4 * 0.22;
      const swirlSign = r5 > 0.5 ? 1 : -1;
      const startRot = (r5 - 0.5) * 2.2;
      const swirlAngle = swirlSign * (1.2 + r1 * 1.4);

      SWARM_WORDS.push({
        idx,
        side, // 0 = front, 1 = back, 2 = left wall, 3 = right wall
        targetX,
        targetY,
        targetZ,
        startX,
        startY,
        startZ,
        scale,
        delay,
        startRot,
        swirlAngle
      });
    }

    function buildTypographyLayout() {
      BASE_SCALE = TEXT_PX / Math.max(SPRITES[1].h, 1);
      const yStart = Math.floor(CY - 0.47 * HEART_WIDTH);
      const yEnd = Math.floor(CY + 0.46 * HEART_WIDTH);
      const sideRowSet = new Set();

      let r = 0;
      for (let y = yStart; y < yEnd; y += PITCH, r++) {
        const yMin = Math.max(0, Math.floor(y - TEXT_PX / 2));
        const yMax = Math.min(H - 1, Math.floor(y + TEXT_PX / 2));

        let runStart = -1;
        for (let x = 0; x < W; x++) {
          let maxRad = 0;
          for (let yy = yMin; yy <= yMax; yy++) {
            const rv = RAD[yy * W + x];
            if (rv > maxRad) maxRad = rv;
          }
          const valid = maxRad < 0.982;
          if (valid && runStart === -1) {
            runStart = x;
          } else if (!valid && runStart !== -1) {
            if (x - runStart >= 16) {
              processBandRun(r, Math.round(y), runStart, x - 1, sideRowSet);
            }
            runStart = -1;
          }
        }
        if (runStart !== -1 && W - runStart >= 16) {
          processBandRun(r, Math.round(y), runStart, W - 1, sideRowSet);
        }
      }

      SIDE_ROWS = Array.from(sideRowSet).sort((a, b) => a - b);

      // Also add side-wall phrases into the 3D gathering swarm
      for (let end = 0; end < 2; end++) {
        for (let sr = 0; sr < SIDE_ROWS.length; sr++) {
          const y = SIDE_ROWS[sr];
          let chosenIdx = 0;
          let ks = BASE_SCALE;
          for (let tries = 0; tries < N; tries++) {
            const idx = (sr * 17 + end * 41 + tries * 3) % N;
            const scaleTry = Math.min(BASE_SCALE, (WD - 4) / Math.max(SPRITES[idx].w, 1));
            if (scaleTry >= BASE_SCALE * 0.52) {
              chosenIdx = idx;
              ks = scaleTry;
              break;
            }
          }
          // Find approximate edge X on this row
          let edgeX = end === 0 ? -120 : 120;
          for (let x = 0; x < W; x++) {
            if (INSIDE[y * W + x]) {
              edgeX = (end === 0 ? x : W - x) - CX;
              if (end === 0) break;
            }
          }
          createSwarmParticle(
            chosenIdx,
            edgeX,
            y - CY,
            0,
            ks,
            2 + end,
            sr * 911 + end * 3571
          );
        }
      }
    }

    function processBandRun(r, y, xl, xr, sideRowSet) {
      sideRowSet.add(y);
      for (const side of [0, 1]) {
        const seed = r * 13 + side * 29 + xl;
        const items = fitRow(xl, xr, seed, BASE_SCALE);
        for (let j = 0; j < items.length; j++) {
          const item = items[j];
          const centerX = item.x + item.w / 2;
          const sampleX = Math.max(0, Math.min(W - 1, Math.round(centerX)));
          const zSurface = Z_FIELD[y * W + sampleX] || WALL;

          // Target 3D coordinates relative to heart center (CX, CY, 0)
          const targetX = centerX - CX;
          const targetY = y - CY;
          const targetZ = side === 0 ? zSurface : -zSurface;

          LAYOUT[side].push({
            r,
            j,
            idx: item.idx,
            x: item.x,
            w: item.w,
            y
          });

          createSwarmParticle(
            item.idx,
            targetX,
            targetY,
            targetZ,
            BASE_SCALE,
            side,
            r * 7919 + j * 104729 + side * 31
          );
        }
      }
    }

    // =========================================================================
    // 6. PRE-BAKED FULL CHROME HEART TEXTURES (Instant lock-in once gathered)
    // =========================================================================
    const frontTex = new Float32Array(W * H);
    const backTex = new Float32Array(W * H);
    const sideTex0 = new Float32Array(H * WD);
    const sideTex1 = new Float32Array(H * WD);

    function stampSpriteFull(buffer, bufW, bufH, idx, cx, cy, k) {
      const sp = getScaledSprite(idx, k);
      const sw = sp.w;
      const sh = sp.h;
      const x0 = Math.floor(cx - sw / 2);
      const y0 = Math.floor(cy - sh / 2);
      const cx0 = Math.max(0, x0);
      const cy0 = Math.max(0, y0);
      const cx1 = Math.min(bufW, x0 + sw);
      const cy1 = Math.min(bufH, y0 + sh);

      for (let y = cy0; y < cy1; y++) {
        const sy = y - y0;
        const rowOffDst = y * bufW;
        const rowOffSrc = sy * sw;
        for (let x = cx0; x < cx1; x++) {
          const sx = x - x0;
          const val = sp.data[rowOffSrc + sx];
          if (val > buffer[rowOffDst + x]) {
            buffer[rowOffDst + x] = val;
          }
        }
      }
    }

    function bakeAssembledHeartTextures() {
      frontTex.fill(0);
      backTex.fill(0);
      sideTex0.fill(0);
      sideTex1.fill(0);

      for (const side of [0, 1]) {
        const targetBuf = side === 0 ? frontTex : backTex;
        const list = LAYOUT[side];
        for (let i = 0; i < list.length; i++) {
          const item = list[i];
          stampSpriteFull(targetBuf, W, H, item.idx, item.x + item.w / 2, item.y, BASE_SCALE);
        }
      }

      for (let end = 0; end < 2; end++) {
        const sBuf = end === 0 ? sideTex0 : sideTex1;
        for (let r = 0; r < SIDE_ROWS.length; r++) {
          const y = SIDE_ROWS[r];
          let chosenIdx = 0;
          let ks = BASE_SCALE;
          for (let tries = 0; tries < N; tries++) {
            const idx = (r * 17 + end * 41 + tries * 3) % N;
            const scaleTry = Math.min(BASE_SCALE, (WD - 4) / Math.max(SPRITES[idx].w, 1));
            if (scaleTry >= BASE_SCALE * 0.52) {
              chosenIdx = idx;
              ks = scaleTry;
              break;
            }
          }
          stampSpriteFull(sBuf, WD, H, chosenIdx, WD / 2, y, ks);
        }
      }
    }

    // =========================================================================
    // 7. 3D CHROME SCANLINE RENDERER + 3D WORD-GATHERING SWARM RENDERER
    // =========================================================================
    const frameRGB = new Float32Array(W * H * 3);
    const trailRGB = new Float32Array(W * H * 3);
    const depthBuf = new Float32Array(W);
    const rowR = new Float32Array(W);
    const rowG = new Float32Array(W);
    const rowB = new Float32Array(W);

    function smoothstep(x) {
      const c = Math.max(0, Math.min(1, x));
      return c * c * (3 - 2 * c);
    }

    function easeOutQuint(x) {
      const t = Math.max(0, Math.min(1, x));
      return 1 - Math.pow(1 - t, 5);
    }

    function renderAssembledChromeHeart(th) {
      const [skyR, skyG, skyB] = SKY;
      const [bandR, bandG, bandB] = BAND;
      const [flrR, flrG, flrB] = FLOOR;

      const c = Math.cos(th);
      const s = Math.sin(th);

      frameRGB.fill(0);

      for (let rIdx = 0; rIdx < RUNS.length; rIdx++) {
        const { y, x0, x1 } = RUNS[rIdx];
        const rowOffset = y * W;

        depthBuf.fill(-1e9);
        rowR.fill(0);
        rowG.fill(0);
        rowB.fill(0);

        const plotSample = (xLocal, zLocal, texVal, nx, ny, nz, isSideWall) => {
          if (texVal <= 0.01) return;

          const nxr = nx * c + nz * s;
          const nzr = -nx * s + nz * c;
          if (nzr <= -0.05) return;

          const sx = Math.round(xLocal * c + zLocal * s + CX);
          if (sx < 0 || sx >= W) return;

          const depth = -xLocal * s + zLocal * c;
          if (depth < depthBuf[sx]) return;

          const ry = isSideWall ? 0.25 : 2 * nzr * ny;
          const rx = 2 * nzr * nxr;

          const sky = smoothstep((ry - 0.12) / 0.3);
          const floor = smoothstep((-ry - 0.05) / 0.4);
          const mid = Math.max(0, 1 - sky - floor);

          const streak =
            Math.exp(-Math.pow((rx + 0.35) / 0.08, 2)) *
            smoothstep((ry + 0.1) / 0.3) *
            0.5;

          const cr = bandR * mid + skyR * sky + flrR * floor + streak;
          const cg = bandG * mid + skyG * sky + flrG * floor + streak;
          const cb = bandB * mid + skyB * sky + flrB * floor + streak;

          const rim = Math.max(0, Math.min(1, 1 - Math.abs(nzr)));
          const intensity = texVal * (0.95 + 0.8 * rim);

          depthBuf[sx] = depth;
          rowR[sx] = cr * intensity;
          rowG[sx] = cg * intensity;
          rowB[sx] = cb * intensity;
        };

        for (let x = x0; x <= x1; x++) {
          const idx = rowOffset + x;
          const xLocal = x - CX;
          const z = Z_FIELD[idx];
          const zx = ZX[idx];
          const zy = ZY[idx];
          const invNorm = 1.0 / Math.sqrt(zx * zx + zy * zy + 1.0);
          const ny = zy * invNorm;

          const tFront = frontTex[idx];
          if (tFront > 0.01) {
            plotSample(xLocal, z, tFront, -zx * invNorm, ny, invNorm, false);
          }

          const mirrorX = Math.max(0, Math.min(W - 1, Math.round(2 * CX - x)));
          const tBack = backTex[rowOffset + mirrorX];
          if (tBack > 0.01) {
            plotSample(xLocal, -z, tBack, zx * invNorm, ny, -invNorm, false);
          }
        }

        const endpoints = [
          { end: 0, xe: x0, nx: -1.0, sBuf: sideTex0 },
          { end: 1, xe: x1, nx: 1.0, sBuf: sideTex1 }
        ];

        for (let e = 0; e < 2; e++) {
          const { end, xe, nx, sBuf } = endpoints[e];
          const ze = Math.max(Z_FIELD[rowOffset + xe], WALL * 0.8);
          const xLocal = xe - CX;
          const sideRowOff = y * WD;

          for (let zs = -ze; zs <= ze; zs += 0.75) {
            const uNorm = (end === 0 ? ze - zs : zs + ze) / (2 * ze);
            const u = Math.max(0, Math.min(WD - 1, Math.floor(uNorm * (WD - 1))));
            const tSide = sBuf[sideRowOff + u];
            if (tSide > 0.01) {
              plotSample(xLocal, zs, tSide, nx, 0.12, 0.0, true);
            }
          }
        }

        for (let x = 0; x < W; x++) {
          if (depthBuf[x] > -1e8) {
            const pIdx = (rowOffset + x) * 3;
            frameRGB[pIdx] = rowR[x];
            frameRGB[pIdx + 1] = rowG[x];
            frameRGB[pIdx + 2] = rowB[x];
          }
        }
      }
    }

    // =========================================================================
    // 8. COMPOSITING PIPELINE (SWARM GATHERING -> 3D CHROME + OPTICAL BLOOM)
    // =========================================================================
    const rawCanvas = document.createElement("canvas");
    rawCanvas.width = W;
    rawCanvas.height = H;
    const rawCtx = rawCanvas.getContext("2d");
    const rawImgData = rawCtx.createImageData(W, H);

    const glowSmall1 = document.createElement("canvas");
    glowSmall1.width = Math.floor(W / 4);
    glowSmall1.height = Math.floor(H / 4);
    const gCtx1 = glowSmall1.getContext("2d");

    const glowSmall2 = document.createElement("canvas");
    glowSmall2.width = Math.floor(W / 8);
    glowSmall2.height = Math.floor(H / 8);
    const gCtx2 = glowSmall2.getContext("2d");

    const mainCanvas = document.getElementById("mainCanvas");
    const mainCtx = mainCanvas.getContext("2d");

    let hasTrail = false;
    const projectedList = [];

    function renderWordGatheringSwarm(t, th) {
      rawCtx.fillStyle = "#000000";
      rawCtx.fillRect(0, 0, W, H);

      const c = Math.cos(th);
      const s = Math.sin(th);
      const fov = 680;

      projectedList.length = 0;

      for (let i = 0; i < SWARM_WORDS.length; i++) {
        const p = SWARM_WORDS[i];

        // Compute target world position rotated by current heart angle
        const rotTargetX = p.targetX * c + p.targetZ * s;
        const rotTargetZ = -p.targetX * s + p.targetZ * c;
        const rotTargetY = p.targetY;

        // Per-word staggered quintic ease-out progress
        const localNorm = (t - p.delay * GATHER_DURATION) / ((1 - p.delay) * GATHER_DURATION);
        const u = easeOutQuint(localNorm);
        const invU = 1 - u;

        // Vortex spiral convergence path from scattered 3D cloud into target slot
        const swirl = p.swirlAngle * invU * invU;
        const sc = Math.cos(swirl);
        const ss = Math.sin(swirl);
        const sxSwirled = p.startX * sc - p.startZ * ss;
        const szSwirled = p.startX * ss + p.startZ * sc;

        const wx = sxSwirled * invU + rotTargetX * u;
        const wy = p.startY * invU + rotTargetY * u;
        const wz = szSwirled * invU + rotTargetZ * u;

        // Perspective projection
        const camDist = fov - wz;
        if (camDist <= 40) continue;
        const persp = fov / camDist;

        const screenX = CX + wx * persp;
        const screenY = CY + wy * persp;
        const drawScale = p.scale * persp;

        // Back-facing words fade smoothly as they lock into the back of the heart
        const facingFade = u > 0.7 ? (rotTargetZ < -12 ? 0.35 : 1.0) : 1.0;
        const alpha = Math.min(1.0, (0.2 + 0.8 * Math.min(1, localNorm * 2.5)) * facingFade);

        if (alpha <= 0.02) continue;

        projectedList.push({
          idx: p.idx,
          x: screenX,
          y: screenY,
          z: wz,
          scale: drawScale,
          rot: p.startRot * invU,
          alpha
        });
      }

      // Painter's back-to-front depth sort
      projectedList.sort((a, b) => a.z - b.z);

      for (let i = 0; i < projectedList.length; i++) {
        const item = projectedList[i];
        const sp = SPRITES[item.idx];
        const dw = sp.w * item.scale;
        const dh = sp.h * item.scale;

        rawCtx.save();
        rawCtx.globalAlpha = item.alpha;
        rawCtx.translate(item.x, item.y);
        if (Math.abs(item.rot) > 0.005) {
          rawCtx.rotate(item.rot);
        }
        rawCtx.drawImage(sp.canvas, -dw * 0.5, -dh * 0.5, dw, dh);
        rawCtx.restore();
      }
    }

    function compositeAndDisplay(paused, t, manualAngle, zoomLevel) {
      const th = (2 * Math.PI * t) / TURN + manualAngle;

      // Phase 1: Word-gathering 3D vortex assembly (0 -> GATHER_DURATION)
      // Phase 2: Seamless transition into full 3D normal-mapped chrome heart
      const blendStart = GATHER_DURATION - 0.45;

      if (t < blendStart) {
        // Pure 3D word gathering swarm
        renderWordGatheringSwarm(t, th);
        hasTrail = false;
      } else if (t < GATHER_DURATION) {
        // Cross-dissolve the final snap into the metallic chrome-shaded 3D heart
        const blend = smoothstep((t - blendStart) / (GATHER_DURATION - blendStart));

        renderAssembledChromeHeart(th);
        trailRGB.set(frameRGB);
        hasTrail = true;

        // Draw swarm first, then overlay chrome heart with increasing opacity
        renderWordGatheringSwarm(t, th);

        const pixels = rawImgData.data;
        const totalPx = W * H;
        for (let i = 0; i < totalPx; i++) {
          const fIdx = i * 3;
          const pIdx = i * 4;
          const r = frameRGB[fIdx] * 255;
          const g = frameRGB[fIdx + 1] * 255;
          const b = frameRGB[fIdx + 2] * 255;
          const lum = Math.max(r, g, b);
          if (lum > 1) {
            const a = Math.min(1, (lum / 90) * blend);
            pixels[pIdx] = pixels[pIdx] * (1 - a) + r * a;
            pixels[pIdx + 1] = pixels[pIdx + 1] * (1 - a) + g * a;
            pixels[pIdx + 2] = pixels[pIdx + 2] * (1 - a) + b * a;
            pixels[pIdx + 3] = 255;
          }
        }
        rawCtx.putImageData(rawImgData, 0, 0);
      } else {
        // Full assembled 3D chrome heart with persistence trail
        if (!paused || !hasTrail) {
          renderAssembledChromeHeart(th);
          const len = W * H * 3;
          if (!hasTrail) {
            trailRGB.set(frameRGB);
            hasTrail = true;
          } else {
            for (let i = 0; i < len; i++) {
              const decayed = trailRGB[i] * TRAIL;
              const fresh = frameRGB[i];
              trailRGB[i] = fresh > decayed ? fresh : decayed;
            }
          }
        }

        const pixels = rawImgData.data;
        const totalPx = W * H;
        for (let i = 0; i < totalPx; i++) {
          const fIdx = i * 3;
          const pIdx = i * 4;
          pixels[pIdx] = Math.min(255, Math.max(0, trailRGB[fIdx] * 255));
          pixels[pIdx + 1] = Math.min(255, Math.max(0, trailRGB[fIdx + 1] * 255));
          pixels[pIdx + 2] = Math.min(255, Math.max(0, trailRGB[fIdx + 2] * 255));
          pixels[pIdx + 3] = 255;
        }
        rawCtx.putImageData(rawImgData, 0, 0);
      }

      // Match responsive HiDPI viewport
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const dispW = Math.floor(window.innerWidth * dpr);
      const dispH = Math.floor(window.innerHeight * dpr);
      if (mainCanvas.width !== dispW || mainCanvas.height !== dispH) {
        mainCanvas.width = dispW;
        mainCanvas.height = dispH;
      }

      mainCtx.globalCompositeOperation = "source-over";
      mainCtx.fillStyle = "#000000";
      mainCtx.fillRect(0, 0, dispW, dispH);

      const baseScale = Math.min((dispW * 0.94) / W, (dispH * 0.9) / H) * zoomLevel;
      const drawW = W * baseScale;
      const drawH = H * baseScale;
      const drawX = (dispW - drawW) * 0.5;
      const drawY = (dispH - drawH) * 0.5;

      // 1. Sharp primary render pass
      mainCtx.imageSmoothingEnabled = true;
      mainCtx.imageSmoothingQuality = "high";
      mainCtx.drawImage(rawCanvas, drawX, drawY, drawW, drawH);

      // 2. Tight optical bloom pass
      gCtx1.clearRect(0, 0, glowSmall1.width, glowSmall1.height);
      gCtx1.filter = "blur(3px)";
      gCtx1.drawImage(rawCanvas, 0, 0, glowSmall1.width, glowSmall1.height);

      mainCtx.globalCompositeOperation = "lighter";
      mainCtx.globalAlpha = 0.72;
      mainCtx.drawImage(glowSmall1, drawX, drawY, drawW, drawH);

      // 3. Wide atmospheric glow pass
      gCtx2.clearRect(0, 0, glowSmall2.width, glowSmall2.height);
      gCtx2.filter = "blur(6px)";
      gCtx2.drawImage(rawCanvas, 0, 0, glowSmall2.width, glowSmall2.height);

      mainCtx.globalAlpha = 0.45;
      mainCtx.drawImage(glowSmall2, drawX, drawY, drawW, drawH);

      mainCtx.globalAlpha = 1.0;
      mainCtx.globalCompositeOperation = "source-over";
    }

    // =========================================================================
    // 9. SILENT DIRECT INTERACTION (Drag to Rotate, Wheel/Pinch to Zoom, Keys)
    // =========================================================================
    let simTime = 0.0;
    let isPaused = false;
    let manualAngle = 0.0;
    let zoomLevel = 1.0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartAngle = 0;
    let lastPinchDist = 0;
    let lastFrameTime = performance.now();

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        isPaused = !isPaused;
      } else if (e.key === "r" || e.key === "R") {
        simTime = 0.0;
        hasTrail = false;
        manualAngle = 0.0;
        isPaused = false;
      }
    });

    mainCanvas.addEventListener("pointerdown", (e) => {
      isDragging = true;
      dragStartX = e.clientX;
      dragStartAngle = manualAngle;
      mainCanvas.setPointerCapture(e.pointerId);
    });

    mainCanvas.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      manualAngle = dragStartAngle + (dx / window.innerWidth) * Math.PI * 2.2;
      if (isPaused) hasTrail = false;
    });

    const endDrag = (e) => {
      if (!isDragging) return;
      isDragging = false;
      try {
        mainCanvas.releasePointerCapture(e.pointerId);
      } catch (_) {}
    };
    mainCanvas.addEventListener("pointerup", endDrag);
    mainCanvas.addEventListener("pointercancel", endDrag);

    // Touch pinch-to-zoom support
    mainCanvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if (lastPinchDist > 0) {
          const delta = (dist - lastPinchDist) * 0.004;
          zoomLevel = Math.max(0.6, Math.min(1.65, zoomLevel + delta));
          if (isPaused) hasTrail = false;
        }
        lastPinchDist = dist;
      }
    }, { passive: true });

    mainCanvas.addEventListener("touchend", () => {
      lastPinchDist = 0;
    }, { passive: true });

    // Mouse wheel zoom
    window.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoomLevel = Math.max(0.6, Math.min(1.65, zoomLevel - e.deltaY * 0.0008));
      if (isPaused) hasTrail = false;
    }, { passive: false });

    // =========================================================================
    // 10. IMMEDIATE STARTUP & 60FPS ANIMATION LOOP
    // =========================================================================
    function startApp() {
      generateSprites();
      buildHeartGeometry();
      buildTypographyLayout();
      bakeAssembledHeartTextures();

      lastFrameTime = performance.now();

      function tick(now) {
        const dt = Math.min((now - lastFrameTime) / 1000, 1 / 15);
        lastFrameTime = now;

        if (!isPaused) {
          simTime += dt;
        }

        compositeAndDisplay(isPaused, simTime, manualAngle, zoomLevel);
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", startApp);
    } else {
      startApp();
    }
  </script>
</body>
